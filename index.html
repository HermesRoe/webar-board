<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR Notice Board - Dynamic Prototype</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      /* Category Filter Dock */
      .top-dock {
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 9999;
      }
      .filter-btn {
        background: rgba(15, 23, 42, 0.85);
        color: #e2e8f0;
        border: 1px solid #38bdf8;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        font-family: sans-serif;
      }
      .filter-btn.active {
        background: #0284c7;
        color: #ffffff;
      }
      /* Carousel Navigation */
      .nav-btn {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.6);
        color: #ffffff;
        border: 2px solid #ffffff;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        font-size: 20px;
        font-weight: bold;
        z-index: 9999;
      }
      #prev-btn { left: 15px; }
      #next-btn { right: 15px; }
      /* In-AR Transaction Dock */
      .action-dock {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 9999;
        width: 90%;
        max-width: 360px;
      }
      .dock-btn {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 12px;
        font-family: sans-serif;
        font-weight: bold;
        font-size: 13px;
        text-align: center;
        text-decoration: none;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
      #reg-btn { background: #f97316; color: #ffffff; }
      #sync-btn { background: #10b981; color: #ffffff; }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- 1. Category Filtering Dock -->
    <div class="top-dock">
      <button class="filter-btn active" onclick="filterCategory('All')">All</button>
      <button class="filter-btn" onclick="filterCategory('Tech')">Tech Events</button>
      <button class="filter-btn" onclick="filterCategory('Exams')">Exams</button>
    </div>

    <!-- 2. Carousel Controls -->
    <button class="nav-btn" id="prev-btn" onclick="prevNotice()">❮</button>
    <button class="nav-btn" id="next-btn" onclick="nextNotice()">❯</button>

    <!-- 3. Direct Action Dock -->
    <div class="action-dock">
      <a id="reg-btn" class="dock-btn" href="#" target="_blank">Register Now</a>
      <button id="sync-btn" class="dock-btn" onclick="logTelemetry()">+ Add to Calendar</button>
    </div>

    <!-- WebAR Scene -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-marker preset="hiro">
        <!-- Countdown Floating Badge -->
        <a-plane position="0 1.45 0.05" rotation="-90 0 0" width="1.4" height="0.25" color="#0f172a" material="opacity: 0.9;">
          <a-text id="ar-countdown" value="Ends in: 02d 14h 30m" align="center" position="0 0 0.02" width="2" color="#38bdf8"></a-text>
        </a-plane>

        <!-- Main 3D Poster Canvas -->
        <a-plane id="ar-card" position="0 0.2 0" rotation="-90 0 0" width="1.6" height="2.1" color="#1e293b" material="opacity: 0.95;">
          <a-text id="ar-dept" value="Dept of CSE" align="center" position="0 0.85 0.05" width="1.6" color="#94a3b8"></a-text>
          <a-text id="ar-title" value="Sathyabama Hackathon" align="center" position="0 0.5 0.05" width="2.4" color="#ffffff"></a-text>
          <a-text id="ar-date" value="Date: Oct 24-25, 2026" align="center" position="0 0.15 0.05" width="1.8" color="#38bdf8"></a-text>
          <a-text id="ar-desc" value="Build WebAR & AI solutions.\nPrizes worth 50k!" align="center" position="0 -0.2 0.05" width="1.5" color="#cbd5e1"></a-text>

          <!-- Engagement Telemetry Bar -->
          <a-plane position="0 -0.75 0.02" width="1.4" height="0.35" color="#0f172a" material="opacity: 0.9;">
            <a-text id="ar-metric" value="142 Registered | 520 Views" align="center" position="0 0 0.02" width="1.7" color="#facc15"></a-text>
          </a-plane>
        </a-plane>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Mock Cloud Database (Simulating Supabase REST payload)
      const noticesData = [
        {
          id: 1,
          category: 'Tech',
          dept: 'Dept of CSE',
          title: 'Sathyabama Hackathon',
          date: 'Date: Oct 24-25, 2026',
          desc: 'Build WebAR & AI solutions.\nPrizes worth 50k!',
          countdown: 'Ends in: 02d 14h 30m',
          registered: 142,
          views: 520,
          regUrl: 'https://forms.google.com',
          bgColor: '#1e293b'
        },
        {
          id: 2,
          category: 'Exams',
          dept: 'Office of Controller of Exams',
          title: 'Semester Timetable Out',
          date: 'Exams Begin: Nov 15',
          desc: 'Hall tickets available on ERP.\nClear dues before Nov 5.',
          countdown: 'Notice: Immediate',
          registered: 0,
          views: 1240,
          regUrl: 'https://sathyabama.ac.in',
          bgColor: '#1e3a8a'
        },
        {
          id: 3,
          category: 'Tech',
          dept: 'School of Computing',
          title: 'Robotics Workshop',
          date: 'Date: Nov 02, 2026',
          desc: 'Hands-on ROS2 and Microcontrollers.\nLimited to 60 seats.',
          countdown: 'Ends in: 05d 08h 12m',
          registered: 48,
          views: 310,
          regUrl: 'https://forms.google.com',
          bgColor: '#064e3b'
        }
      ];

      let currentIndex = 0;
      let activeList = [...noticesData];

      function renderNotice() {
        const item = activeList[currentIndex];
        document.getElementById('ar-dept').setAttribute('value', item.dept);
        document.getElementById('ar-title').setAttribute('value', item.title);
        document.getElementById('ar-date').setAttribute('value', item.date);
        document.getElementById('ar-desc').setAttribute('value', item.desc);
        document.getElementById('ar-countdown').setAttribute('value', item.countdown);
        document.getElementById('ar-card').setAttribute('color', item.bgColor);
        document.getElementById('ar-metric').setAttribute('value', `${item.registered} Registered | ${item.views} Views`);
        document.getElementById('reg-btn').setAttribute('href', item.regUrl);
      }

      function nextNotice() {
        currentIndex = (currentIndex + 1) % activeList.length;
        activeList[currentIndex].views++; // Simulating view count telemetry
        renderNotice();
      }

      function prevNotice() {
        currentIndex = (currentIndex - 1 + activeList.length) % activeList.length;
        renderNotice();
      }

      function filterCategory(cat) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        activeList = (cat === 'All') ? noticesData : noticesData.filter(n => n.category === cat);
        currentIndex = 0;
        renderNotice();
      }

      function logTelemetry() {
        alert("Action Dispatched: Calendar entry synced to device and logged to telemetry repository.");
      }

      renderNotice();
    </script>
  </body>
</html>
