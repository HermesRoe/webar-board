<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR Notice Board</title>
    <!-- A-Frame & AR.js CDN -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      /* 2D overlay action button */
      #register-btn {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        background: #ff5722;
        color: #fff;
        font-weight: bold;
        border: none;
        border-radius: 25px;
        z-index: 9999;
        font-family: sans-serif;
        text-decoration: none;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- Tap-to-Register Trigger -->
    <a id="register-btn" href="https://forms.google.com" target="_blank">🔗 Register for Hackathon</a>

    <!-- AR Scene -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <!-- Track the standard Hiro Marker -->
      <a-marker preset="hiro">
        <!-- 3D Poster Base Card -->
        <a-plane position="0 0.2 0" rotation="-90 0 0" width="1.6" height="2.2" color="#1a237e" material="opacity: 0.95;">
          <!-- Title -->
          <a-text value="Sathyabama Hackathon" align="center" position="0 0.8 0.05" width="2.5" color="#ffffff"></a-text>
          <!-- Subtitle / Dates -->
          <a-text value="Dates: Oct 24-25 | CSE Dept" align="center" position="0 0.5 0.05" width="1.8" color="#80d8ff"></a-text>
          <!-- Countdown / Live metric -->
          <a-text value="Seats Left: 24 | Registered: 142" align="center" position="0 0.1 0.05" width="1.6" color="#ffd600"></a-text>
          <!-- Details text -->
          <a-text value="Scan to view PDF rules and sync calendar." align="center" position="0 -0.4 0.05" width="1.3" color="#e0e0e0"></a-text>
        </a-plane>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
