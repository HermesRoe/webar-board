<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebAR Notice Board</title>
    <!-- Proven, Rock-Solid Library Pair -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.3.1/aframe/build/aframe-ar.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      /* UI Controls - Clean, Big, Touch-Friendly */
      .touch-controls {
        position: fixed;
        bottom: 25px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
        z-index: 10000;
        pointer-events: none;
      }
      .btn-arrow {
        pointer-events: auto;
        background: #ffffff;
        color: #0f172a;
        border: 2px solid #0f172a;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        font-size: 24px;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
      .btn-reg {
        pointer-events: auto;
        background: #f97316;
        color: #ffffff;
        border: 2px solid #0f172a;
        padding: 12px 24px;
        border-radius: 25px;
        font-size: 15px;
        font-weight: bold;
        text-decoration: none;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>
    <!-- Screen Overlay UI Buttons -->
    <div class="touch-controls">
      <button class="btn-arrow" onclick="prevNotice()">❮</button>
      <a id="ui-reg-btn" class="btn-reg" href="https://forms.google.com" target="_blank">Register Here ↗</a>
      <button class="btn-arrow" onclick="nextNotice()">❯</button>
    </div>

    <!-- AR Scene: Zero-Lag Settings -->
    <a-scene 
      embedded 
      vr-mode-ui="enabled: false" 
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono;">
      
      <a-marker preset="hiro">
        
        <!-- Root Entity Raised Slightly Above the Marker -->
        <a-entity position="0 0.2 0">

          <!-- 1. Top Floating Countdown -->
          <a-plane position="0 1.3 0" width="1.6" height="0.25" color="#0f172a" material="opacity: 0.95">
            <a-text id="ar-countdown" value="Ends in: 02d 14h 30m" align="center" position="0 0 0.02" width="2.4" color="#38bdf8"></a-text>
          </a-plane>

          <!-- 2. Dept Circle Badge -->
          <a-circle position="0.9 1.3 0" radius="0.22" color="#ffffff">
            <a-text id="ar-dept" value="CSE" align="center" position="0 0 0.02" width="2" color="#0f172a"></a-text>
          </a-circle>

          <!-- 3. Main Poster Canvas (Faces Upright at the User) -->
          <a-plane id="ar-canvas" position="0 0.1 0" width="1.8" height="2.0" color="#dcfce7">
            <!-- Header -->
            <a-plane position="0 0.7 0.01" width="1.65" height="0.35" color="#ffffff">
              <a-text id="ar-institution" value="Sathyabama" align="center" position="0 0 0.02" width="3.2" color="#15803d"></a-text>
            </a-plane>
            <!-- Title -->
            <a-text id="ar-title" value="Hackathon\n&\nTech Event" align="center" position="0 0.1 0.02" width="2.8" color="#0f172a"></a-text>
            <!-- Subtitle -->
            <a-text id="ar-sub" value="Theme: WebAR & Spatial UI" align="center" position="0 -0.45 0.02" width="1.8" color="#334155"></a-text>
          </a-plane>

          <!-- 4. Lateral Navigation Indicators -->
          <a-plane position="-1.05 0.1 0.02" width="0.25" height="0.35" color="#ffffff">
            <a-text value="<" align="center" position="0 0 0.02" width="3" color="#0f172a"></a-text>
          </a-plane>
          <a-plane position="1.05 0.1 0.02" width="0.25" height="0.35" color="#ffffff">
            <a-text value=">" align="center" position="0 0 0.02" width="3" color="#0f172a"></a-text>
          </a-plane>

          <!-- 5. Bottom Registration Count -->
          <a-plane position="0 -1.05 0.02" width="1.5" height="0.28" color="#ffffff">
            <a-text id="ar-registered" value="142 Registered [PDF]" align="center" position="0 0 0.02" width="2.2" color="#0f172a"></a-text>
          </a-plane>

        </a-entity>

      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const notices = [
        {
          dept: "CSE",
          inst: "Sathyabama",
          title: "Hackathon\n&\nTech Event",
          sub: "Theme: WebAR & Spatial UI",
          countdown: "Ends in: 02d 14h 30m",
          registered: "142 Registered [PDF]",
          canvasColor: "#dcfce7",
          regUrl: "https://forms.google.com"
        },
        {
          dept: "Exam",
          inst: "University",
          title: "Semester\nExam Schedule",
          sub: "Hall Tickets Available",
          countdown: "Starts in: 12d 06h",
          registered: "Circulated to All",
          canvasColor: "#e0f2fe",
          regUrl: "https://sathyabama.ac.in"
        },
        {
          dept: "Mech",
          inst: "Workshop",
          title: "Robotics &\nDrone Flight",
          sub: "Hands-on Flight Control",
          countdown: "Ends in: 05d 10h",
          registered: "68 Registered [PDF]",
          canvasColor: "#ffedd5",
          regUrl: "https://forms.google.com"
        }
      ];

      let currentIndex = 0;

      function updateBoard() {
        const item = notices[currentIndex];
        document.getElementById('ar-dept').setAttribute('value', item.dept);
        document.getElementById('ar-institution').setAttribute('value', item.inst);
        document.getElementById('ar-title').setAttribute('value', item.title);
        document.getElementById('ar-sub').setAttribute('value', item.sub);
        document.getElementById('ar-countdown').setAttribute('value', item.countdown);
        document.getElementById('ar-registered').setAttribute('value', item.registered);
        document.getElementById('ar-canvas').setAttribute('color', item.canvasColor);
        document.getElementById('ui-reg-btn').setAttribute('href', item.regUrl);
      }

      function nextNotice() {
        currentIndex = (currentIndex + 1) % notices.length;
        updateBoard();
      }

      function prevNotice() {
        currentIndex = (currentIndex - 1 + notices.length) % notices.length;
        updateBoard();
      }

      window.onload = updateBoard;
    </script>
  </body>
</html>
